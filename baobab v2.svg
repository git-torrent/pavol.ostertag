<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title">
  <title id="title">Baobab software architecture blueprint</title>
  <style>
    .field { fill: #102a43; }
    .grid { fill: url(#blueprint-grid); }
    .trace { fill: none; stroke-linecap: square; stroke-linejoin: miter; stroke-width: 2; }
    .trace-blue { stroke: #7190aa; }
    .trace-orange { stroke: #f15a29; }
    .node rect { fill: #102a43; stroke: #9fb2c2; stroke-width: 1.5; }
    .node-core rect { fill: #f15a29; stroke: #f15a29; }
    .node text { fill: #f4f5f4; font-family: monospace; font-size: 14px; letter-spacing: 2px; text-anchor: middle; }
    .node-core text { fill: #102a43; font-size: 17px; font-weight: 500; }
    .node-core .node-caption { font-size: 8px; letter-spacing: 1px; }
    .node line { stroke: #102a43; stroke-width: 1; }
    .chip rect { fill: #102a43; stroke: #f15a29; stroke-width: 1.5; }
    .chip path { fill: none; stroke: #9fb2c2; stroke-width: 2; }
    .terminal circle { fill: #f15a29; }
    .blueprint-label { fill: #9fb2c2; font-family: monospace; font-size: 9px; letter-spacing: 1px; }
    .blueprint-label-right { text-anchor: end; }
  </style>
  <defs>
    <pattern id="blueprint-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#f4f5f4" stroke-width="0.7" opacity=".24"/>
    </pattern>
  </defs>
  <rect class="field" x="12" y="12" width="496" height="496" rx="2"/>
  <rect class="grid" x="12" y="12" width="496" height="496"/>
  
  <!-- Base Roots -->
  <path class="trace trace-blue" d="M200 420 v40 l-30 30 h-10 M220 420 v50 l-30 30 v10 M240 420 v60 l-25 25 M260 420 v60 l25 25 M280 420 v50 l30 30 v10 M300 420 v40 l30 30 h10"/>
  <path class="trace trace-orange" d="M210 420 v45 l-25 25 M230 420 v55 l-20 20 M270 420 v55 l20 20 M290 420 v45 l25 25"/>
  <path class="trace trace-blue" d="M190 420 v30 l-40 40 h-20 M310 420 v30 l40 40 h20 M180 420 v20 l-50 50 h-30 M320 420 v20 l50 50 h30"/>

  <!-- Thick Trunk - dense parallel layout -->
  <path class="trace trace-blue" stroke-width="2.5" d="M180 200 v220 M188 200 v220 M196 200 v220 M204 220 v200 M212 240 v180 M220 260 v160 M228 280 v140 M236 300 v120 M244 300 v120 M252 280 v140 M260 260 v160 M268 240 v180 M276 220 v200 M284 200 v220 M292 200 v220 M300 200 v220 M308 200 v220 M316 200 v220"/>
  <path class="trace trace-orange" stroke-width="2.5" d="M200 210 v210 M208 230 v190 M216 250 v170 M224 270 v150 M232 290 v130 M240 290 v130 M248 270 v150 M256 250 v170 M264 230 v190 M272 210 v210 M280 200 v220"/>
  
  <!-- Subtle lateral ties in trunk -->
  <path class="trace trace-blue" stroke-width="1" d="M180 240 h20 M300 240 h16 M188 300 h24 M288 300 h28 M196 360 h24 M280 360 h36 M204 400 h20 M276 400 h24"/>

  <!-- Branching out / Canopy -->
  <path class="trace trace-blue" d="M180 200 l-20 -20 v-30 l-40 -40 h-20 M188 200 l-16 -16 v-40 l-30 -30 v-10 M196 200 l-12 -12 v-50 l-20 -20 v-20 M204 220 l-16 -16 v-60 l-10 -10 v-30 M212 240 l-16 -16 v-70 l-10 -10 v-40 M220 260 l-16 -16 v-80 M280 200 l20 -20 v-30 l40 -40 h20 M288 200 l16 -16 v-40 l30 -30 v-10 M296 200 l12 -12 v-50 l20 -20 v-20 M304 220 l16 -16 v-60 l10 -10 v-30 M312 240 l16 -16 v-70 l10 -10 v-40 M320 260 l16 -16 v-80"/>
  <path class="trace trace-orange" d="M200 210 l-16 -16 v-40 l-24 -24 v-20 M208 230 l-16 -16 v-50 l-10 -10 v-30 M216 250 l-16 -16 v-60 M272 210 l16 -16 v-40 l24 -24 v-20 M280 230 l16 -16 v-50 l10 -10 v-30 M288 250 l16 -16 v-60"/>
  <path class="trace trace-blue" d="M180 180 l-40 -40 v-20 l-40 -40 h-20 M316 200 l40 -40 v-20 l40 -40 h20"/>

  <!-- Core inside the trunk -->
  <g class="node node-core"><rect x="204" y="270" width="92" height="92"/><text x="250" y="315">CORE</text><line x1="220" y1="335" x2="280" y2="335"/><text class="node-caption" x="250" y="350">SYSTEM</text></g>

  <!-- Nodes in the branches -->
  <g class="node node-small"><rect x="50" y="70" width="80" height="44"/><text x="90" y="98">API</text></g>
  <g class="node node-small"><rect x="370" y="70" width="80" height="44"/><text x="410" y="98">LLM</text></g>
  <g class="node node-small"><rect x="140" y="40" width="80" height="44"/><text x="180" y="68">SEC</text></g>
  <g class="node node-small"><rect x="280" y="40" width="80" height="44"/><text x="320" y="68">OPS</text></g>
  
  <g class="chip" transform="translate(60 160)"><rect width="60" height="36"/><path d="M8 10 h44 M8 18 h44 M8 26 h44"/></g>
  <g class="chip" transform="translate(380 160)"><rect width="60" height="36"/><path d="M8 10 h44 M8 18 h44 M8 26 h44"/></g>

  <!-- Terminals -->
  <g class="terminal">
    <circle cx="100" cy="110" r="3.5"/><circle cx="142" cy="74" r="3.5"/><circle cx="164" cy="74" r="3.5"/><circle cx="178" cy="104" r="3.5"/><circle cx="186" cy="104" r="3.5"/>
    <circle cx="204" cy="144" r="3.5"/><circle cx="322" cy="144" r="3.5"/>
    <circle cx="390" cy="110" r="3.5"/><circle cx="358" cy="74" r="3.5"/><circle cx="336" cy="74" r="3.5"/><circle cx="342" cy="104" r="3.5"/><circle cx="332" cy="104" r="3.5"/>
    <circle cx="140" cy="490" r="3.5"/><circle cx="160" cy="500" r="3.5"/><circle cx="185" cy="505" r="3.5"/><circle cx="215" cy="505" r="3.5"/><circle cx="285" cy="505" r="3.5"/><circle cx="315" cy="505" r="3.5"/><circle cx="340" cy="500" r="3.5"/><circle cx="360" cy="490" r="3.5"/><circle cx="100" cy="490" r="3.5"/><circle cx="400" cy="490" r="3.5"/>
  </g>

  <text class="blueprint-label" x="30" y="488">BAOBAB.PC / 02</text><text class="blueprint-label blueprint-label-right" x="490" y="488">LUX / BAOBAB</text>
</svg>