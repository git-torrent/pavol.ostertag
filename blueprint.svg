<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title">
  <title id="title">Abstract software architecture blueprint with connected services and circuit traces</title>
  <style>
    .field { fill: #102a43; }
    .grid { fill: url(#blueprint-grid); }
    .trace { fill: none; stroke-linecap: square; stroke-linejoin: miter; stroke-width: 2; }
    .trace-blue { stroke: #7190aa; }
    .trace-orange { stroke: #f15a29; }
    .node rect { fill: #102a43; stroke: #9fb2c2; stroke-width: 1.5; }
    .node-core rect { fill: #f15a29; stroke: #f15a29; }
    .node text { fill: #f4f5f4; font-family: monospace; font-size: 14px; letter-spacing: 2px; text-anchor: middle; }
    .node-core text { fill: #102a43; font-size: 17px; font-weight: 500; }
    .node-core .node-caption { font-size: 8px; letter-spacing: 1px; }
    .node line { stroke: #102a43; stroke-width: 1; }
    .chip rect { fill: #102a43; stroke: #f15a29; stroke-width: 1.5; }
    .chip path { fill: none; stroke: #9fb2c2; stroke-width: 2; }
    .terminal circle { fill: #f15a29; }
    .blueprint-label { fill: #9fb2c2; font-family: monospace; font-size: 9px; letter-spacing: 1px; }
    .blueprint-label-right { text-anchor: end; }
  </style>
  <defs>
    <pattern id="blueprint-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#f4f5f4" stroke-width="0.7" opacity=".24"/>
    </pattern>
  </defs>
  <rect class="field" x="12" y="12" width="496" height="496" rx="2"/>
  <rect class="grid" x="12" y="12" width="496" height="496"/>
  <path class="trace trace-blue" d="M42 112H106V76H168M350 76H414V142H478M42 390H92V438H188M332 438H414V368H478"/>
  <path class="trace trace-orange" d="M42 244H78V196H142M378 196H442V246H478M234 42V92M286 428V478"/>
  <g class="node node-core"><rect x="168" y="154" width="184" height="164"/><text x="260" y="214">DOMAIN</text><text x="260" y="238">CORE</text><line x1="204" y1="262" x2="316" y2="262"/><text class="node-caption" x="260" y="286">SYSTEM MODEL</text></g>
  <g class="node node-small"><rect x="62" y="76" width="106" height="58"/><text x="115" y="111">API</text></g>
  <g class="node node-small"><rect x="350" y="76" width="106" height="58"/><text x="403" y="111">AI/LLM</text></g>
  <g class="node node-small"><rect x="62" y="362" width="126" height="58"/><text x="125" y="397">SECURITY</text></g>
  <g class="node node-small"><rect x="332" y="362" width="126" height="58"/><text x="395" y="397">DELIVERY</text></g>
  <g class="chip" transform="translate(218 350)"><rect width="84" height="52"/><path d="M12 15H72M12 26H58M12 37H68"/></g>
  <g class="terminal"><circle cx="42" cy="112" r="4"/><circle cx="478" cy="142" r="4"/><circle cx="42" cy="390" r="4"/><circle cx="478" cy="368" r="4"/><circle cx="234" cy="42" r="4"/><circle cx="286" cy="478" r="4"/></g>
  <text class="blueprint-label" x="30" y="488">ARCH / 01</text><text class="blueprint-label blueprint-label-right" x="490" y="488">LUX / REMOTE</text>
</svg>